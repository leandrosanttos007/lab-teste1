name: CI Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            leohurin/lab-teste1:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container sobe e responde /health)
        run: |
          docker run -d --name smoke -p 8080:8080 leohurin/lab-teste1:${{ github.sha }}

          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then
              echo "Smoke test OK"
              exit 0
            fi
            echo "Aguardando o serviço subir... ($i/10)"
            sleep 2
          done

          echo "Smoke test FALHOU: /health não respondeu"
          docker logs smoke
          exit 1

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f smoke || true

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push image (só chega aqui se o smoke test passou)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            leohurin/lab-teste1:${{ github.sha }}
            leohurin/lab-teste1:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: leandrosanttos007/lab-teste1-gitops
          token: ${{ secrets.GIT_TOKEN }}
          path: gitops

      - name: Update image in Deployment
        working-directory: gitops
        run: |
          sed -i "s|image: .*|image: leohurin/lab-teste1:${{ github.sha }}|" k8s/deployment.yaml

          if git diff --quiet; then
            echo "Nenhuma mudança no manifesto, pulando commit."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "update image to ${{ github.sha }}"
          git pull --rebase origin main
          git push
